name: verify

# 每次 push 到 main 或提 PR，都自动跑一遍六层验证。
# 验证内容与本地 `verify-all.cmd` 完全一致，没有任何"CI 专用"的放宽。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  six-layers:
    name: 六层验证（Windows）
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 用 pwsh 包一层：把输出同时写进日志，失败时把末尾 40 行写进运行摘要页，
      # 这样在 Actions 页面上直接能看到挂在哪一层，不必点进日志。
      - name: 六层验证
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmd /c "verify-all.cmd 2>&1" | Tee-Object -FilePath verify.log
          $rc = $LASTEXITCODE
          Write-Host "verify-all 退出码: $rc"
          if ($rc -ne 0) {
            "## 六层验证失败：末尾 40 行" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            Get-Content verify.log -Tail 40 -Encoding utf8 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          } else {
            "六层验证全部通过 ✅" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          exit $rc

      # 对照实验的模板侧基线：不需要 API Key，确保"12 条业务描述 100% 通过官方校验"
      - name: 对照实验基线（模板侧）
        shell: cmd
        run: node scripts\compare-raw-xml.js --dry-run --n 12

      # 六层验证只管 BPMN 本身合不合法；这几项是我们自己的工程约束：
      # 角色组表一致 / 交付包齐不齐 / formKey 挂没挂 / 台账写没写。
      # 单独一步，挂了能一眼看出是"新能力退化"而不是"BPMN 不合法"。
      - name: 新能力自检（角色组 / 交付包 / formKey / 台账）
        shell: cmd
        run: node scripts\check-new-features.js
      # artifact 动作不允许路径里出现 ".."，所以要先把产物拷进工作区
      - name: 收集产物
        if: failure()
        shell: cmd
        run: |
          if not exist ci-artifacts mkdir ci-artifacts
          if exist "..\.data\out\*.bpmn" copy /y "..\.data\verify\*.bpmn" ci-artifacts\ >nul
          dir /b ci-artifacts

      - name: 失败时上传生成物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-bpmn
          path: ci-artifacts
          if-no-files-found: ignore
          retention-days: 7
